[package]
name = "codenotch-cosmic"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Claude Code and Codex usage limits in the COSMIC panel"
repository = "https://github.com/oltiir/codenotch-gnome"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "rt"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for features.
features = [
    "applet",       # panel applet support
    "multi-window", # the popup is a second window
    "tokio",        # async executor
    "wayland",
    "winit",
]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
